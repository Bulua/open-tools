[package]
name = "open-tools"
version = "0.2.0"
description = "工具百宝箱"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "open_tools_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png：运行时换上从网上下载的图标（见 branding.rs）
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 用系统浏览器打开网址（GitHub 仓库、Markdown 中的链接）
tauri-plugin-opener = "2"
# 只允许运行一个实例：程序隐藏在托盘时再次打开，直接显示已有的窗口
tauri-plugin-single-instance = "2"
# HTTP 请求工具：请求从 Rust 发出，不受浏览器跨域限制；可以设置 Origin 等受限的请求头、忽略证书错误
tauri-plugin-http = { version = "2", features = ["unsafe-headers", "dangerous-settings"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
# MQTT 收发支持 TCP/TLS 与 WebSocket，复用现有的 ring 加密后端。
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider", "websocket"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio = { version = "1", features = ["sync", "time", "macros"] }
base64 = "0.22"
# Word 转 Markdown：直接解析 DOCX，并将正文和资源打包。
roxmltree = "0.21"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
# 中文 Windows 命令行输出是 GBK 编码，ping 结果需要转成 UTF-8
encoding_rs = "0.8"
# 校验下载的 AI 模型和运行环境
sha2 = "0.10"
# 图片编解码、缩放裁剪与格式转换（供 AI 图片工具复用）
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "ico", "tiff"] }
# 运行 AI 模型：运行库（onnxruntime.dll 等）随安装包放在安装目录的 ai-runtime 里，运行时动态加载（见 src/tools/image/shared/inference.rs）
# api-24：运行库是 ONNX Runtime 1.24（带 DirectML 的最后一个版本），只用它支持的接口
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"] }

# MCP 工具的子进程包装器负责清理命令启动的进程树。
rmcp = { version = "3.11", default-features = false, features = ["client", "reqwest-tls-no-provider", "transport-streamable-http-client-reqwest", "which-command"] }
reqwest = { version = "0.13", default-features = false }
process-wrap = { version = "10", features = ["tokio1"] }

# 录屏前临时关闭屏幕 HDR（Windows 显示设置接口）；指定 AI 运行库所在的文件夹（LibraryLoader）
[target.'cfg(windows)'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-winrt-notification = "0.8"
png = "0.17"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# 本机 WebSocket 对端用于验证真实握手和 MQTT 收发。
async-tungstenite = { version = "0.29", default-features = false, features = ["tokio-runtime"] }
futures-util = "0.3"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
