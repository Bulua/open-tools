[package]
name = "open-tools"
version = "0.2.0"
description = "工具百宝箱"
edition = "2021"

[lib]
name = "open_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png：运行时换上从网上下载的图标（见 branding.rs）
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 用系统浏览器打开网址（GitHub 仓库、Markdown 中的链接）
tauri-plugin-opener = "2"
# 只允许运行一个实例：程序隐藏在托盘时再次打开，直接显示已有的窗口
tauri-plugin-single-instance = "2"
# HTTP 请求工具：请求从 Rust 发出，不受浏览器跨域限制；可以设置 Origin 等受限的请求头、忽略证书错误
tauri-plugin-http = { version = "2", features = ["unsafe-headers", "dangerous-settings"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 中文 Windows 命令行输出是 GBK 编码，ping 结果需要转成 UTF-8
encoding_rs = "0.8"

# 录屏前临时关闭屏幕 HDR（Windows 显示设置接口）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Gdi"] }
