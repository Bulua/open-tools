[package]
name = "open-tools"
version = "0.2.0"
description = "工具百宝箱"
edition = "2021"

[lib]
name = "open_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 用系统浏览器打开网址（GitHub 仓库、Markdown 中的链接）
tauri-plugin-opener = "2"
# 只允许运行一个实例：程序隐藏在托盘时再次打开，直接显示已有的窗口
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 中文 Windows 命令行输出是 GBK 编码，ping 结果需要转成 UTF-8
encoding_rs = "0.8"
