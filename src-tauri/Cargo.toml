[package]
name = "open-tools"
version = "0.2.0"
description = "工具百宝箱"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "open_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png：运行时换上从网上下载的图标（见 branding.rs）
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 用系统浏览器打开网址（GitHub 仓库、Markdown 中的链接）
tauri-plugin-opener = "2"
# 只允许运行一个实例：程序隐藏在托盘时再次打开，直接显示已有的窗口
tauri-plugin-single-instance = "2"
# HTTP 请求工具：请求从 Rust 发出，不受浏览器跨域限制；可以设置 Origin 等受限的请求头、忽略证书错误
tauri-plugin-http = { version = "2", features = ["unsafe-headers", "dangerous-settings"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# 中文 Windows 命令行输出是 GBK 编码，ping 结果需要转成 UTF-8
encoding_rs = "0.8"
# 校验下载的 AI 模型和运行环境
sha2 = "0.10"
# 运行 AI 模型：运行库（onnxruntime.dll 等）随安装包放在安装目录的 ai-runtime 里，运行时动态加载（见 src/tools/image/inference.rs）
# api-24：运行库是 ONNX Runtime 1.24（带 DirectML 的最后一个版本），只用它支持的接口
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"] }

# 录屏前临时关闭屏幕 HDR（Windows 显示设置接口）；指定 AI 运行库所在的文件夹（LibraryLoader）
[target.'cfg(windows)'.dependencies]
tauri-plugin-global-shortcut = "2"
png = "0.17"
windows-sys = { version = "0.61", features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
