# 补传与版本标签对应的成功构建产物，不需要重新编译或移动标签。
name: Attach Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 Release 标签（例如 v0.11.0）
        required: true
        type: string
      run_id:
        description: 成功的 Build Android APK 运行编号
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  attach-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: 校验版本与构建来源
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh release view "$RELEASE_TAG"
          TAG_SHA="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > run.json
          jq -e --arg sha "$TAG_SHA" '.head_sha == $sha and .conclusion == "success" and .path == ".github/workflows/android.yml"' run.json

      - name: 下载并补传 APK
        shell: bash
        run: |
          gh run download "$RUN_ID" --name Open-Tools-Android-ARM64 --dir dist-android
          APK_PATH="dist-android/OpenTools-${RELEASE_TAG}-Android-ARM64.apk"
          test -s "$APK_PATH"
          gh release upload "$RELEASE_TAG" "$APK_PATH#Android ARM64 测试版（调试签名）"
