# 复用 GitHub Release 中的 APK，同步到 Gitee 的同版本 Release。
name: Sync Android APK to Gitee

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      GITEE_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 Release 标签（例如 v0.11.0）
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gitee-apk-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sync-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 同步 APK 到 Gitee
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::notice::未配置 GITEE_TOKEN，跳过 APK 同步。"
            exit 0
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$RELEASE_TAG" --dir dist-android --pattern "OpenTools_${RELEASE_TAG#v}_arm64-v8a.apk"
          # Gitee 普通仓库单附件上限为 100 MB；超限时无损压缩，解压后即可安装。
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          apk, = Path("dist-android").glob("*.apk")
          if apk.stat().st_size > 100_000_000:
              archive = apk.with_suffix(".apk.zip")
              with ZipFile(archive, "w", compression=ZIP_DEFLATED, compresslevel=9) as output:
                  output.write(apk, arcname=apk.name)
              if archive.stat().st_size > 100_000_000:
                  raise RuntimeError("压缩后的 APK 仍超过 Gitee 单附件上限，无法同步")
              print(f"APK 超过 Gitee 上限，改为上传 {archive.name}，解压后即可安装")
          PY
          node scripts/publish-gitee.mjs "$RELEASE_TAG" dist-android --apk-only
