# 云端构建 Android 测试安装包
# - 推送到 master 或手动触发后，在 Actions 页面的 Artifacts 中下载 APK
# - 只构建真机常用的 arm64-v8a，避免四种架构打进同一个超大安装包
# - 当前生成的是可直接安装的测试 APK，不需要额外配置发布签名密钥
name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 配置 Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          # API 36 是当前稳定 SDK；API 37 尚未作为稳定平台包提供给 sdkmanager。
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16248370"

      - name: 配置 Android NDK
        shell: bash
        run: |
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 类型检查与单元测试
        run: |
          npm run typecheck
          npm test

      # gen/android 是自动生成目录，不提交到 Git；云端每次按当前 Tauri 版本重新生成。
      - name: 初始化 Android 工程
        run: npm run tauri -- android init --ci --skip-targets-install

      # 每次初始化都会重新生成 Wrapper 配置，在这里统一设置下载容错。
      - name: 配置 Gradle 下载超时与重试
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties")
          settings = {
              "networkTimeout": "120000",
              "retries": "3",
              "retryBackOffMs": "2000",
          }
          lines = [
              line for line in path.read_text(encoding="utf-8").splitlines()
              if line.split("=", 1)[0].strip() not in settings
          ]
          lines.extend(f"{key}={value}" for key, value in settings.items())
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      - name: 构建 ARM64 APK
        run: npm run tauri -- android build --debug --apk --target aarch64 --split-per-abi --ci

      - name: 整理 APK 文件名
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          APK_PATH="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          mkdir -p dist-android
          cp "$APK_PATH" "dist-android/OpenTools-v${VERSION}-Android-ARM64.apk"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Open-Tools-Android-ARM64
          path: dist-android/*.apk
          if-no-files-found: error
          retention-days: 14
