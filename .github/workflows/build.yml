# 云端打包 Windows 程序
# - 推送到 master 或手动触发：编译后在 Actions 页面的 Artifacts 中下载
# - 推送 v 开头的标签（如 v0.1.0）：额外发布到 GitHub Releases
name: Build Windows

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 仅在推送标签时创建 Release，其余情况只编译
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Open Tools ${{ github.ref_name }}"
          releaseBody: "下载 *-setup.exe 安装即可使用。"
          releaseDraft: false

      - uses: actions/upload-artifact@v4
        with:
          name: open-tools-windows
          path: |
            src-tauri/target/release/open-tools.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
