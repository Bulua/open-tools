# 云端打包 Windows 程序
# - 推送到 master 或手动触发：编译后在 Actions 页面的 Artifacts 中下载
# - 推送 v 开头的标签（如 v0.2.0）：发布到 GitHub Releases，并生成在线更新文件（latest.json）
#   已安装的程序会通过 latest.json 发现新版本并自动更新
#   需要在仓库 Settings → Secrets 中配置 TAURI_SIGNING_PRIVATE_KEY（更新包签名私钥）
# - 配置了 GITEE_TOKEN 时：代码和标签同步到 Gitee，发布版本时安装包也发到 Gitee Releases，
#   并把更新文件写到 Gitee 的 updater 分支，国内用户优先从 Gitee 更新
name: Build Windows

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# 发布版本（推送标签）排队依次进行，不取消：两个版本同时打包时，先开始的可能后完成，
# 会把「最新版本」和在线更新文件改回旧版本；其他构建同一分支只保留最新一次
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || format('build-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 同步到 Gitee 需要完整历史
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: 类型检查与单元测试
        run: |
          npm run typecheck
          npm test

      # 版本说明来自标签附带的文字：git tag -a v0.2.0 -m "更新内容"
      - name: 读取版本说明
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch --tags --force
          {
            echo "body<<NOTES_EOF"
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # 推送分支时同步 master，推送标签时同步该标签；Gitee 出问题不影响 GitHub 打包
      - name: 同步代码到 Gitee
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then echo "未配置 GITEE_TOKEN，跳过"; exit 0; fi
          git fetch --tags --force
          git push "https://bulua:${GITEE_TOKEN}@gitee.com/bulua/open-tools.git" "$GITHUB_REF"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名私钥，只在发布版本时用到
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 仅在推送标签时创建 Release 并生成签名的更新文件，其余情况只编译
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          args: ${{ startsWith(github.ref, 'refs/tags/') && '--config src-tauri/tauri.release.conf.json' || '' }}
          releaseName: "Open Tools ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body || '下载 *-setup.exe 安装即可使用。' }}
          releaseDraft: false

      # 「最新版本」始终是版本号最大的那个（GitHub 默认把最后发布的标为最新）
      - name: 标记最新版本
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          echo "版本号最大的标签：$latest"
          gh release edit "$latest" --latest || echo "没有找到 $latest 的发布，跳过"

      # 把 GitHub Release 中的安装包传到 Gitee Releases，更新文件放在单独的 updater 分支，不影响 master 历史
      - name: 发布到 Gitee
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then echo "未配置 GITEE_TOKEN，跳过"; exit 0; fi
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/gitee-assets" --pattern latest.json --pattern '*-setup.exe'
          node scripts/publish-gitee.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/gitee-assets" "$RUNNER_TEMP/latest.json"
          # Gitee 上已经是更新的版本时，脚本不生成更新文件，不覆盖
          if [ ! -f "$RUNNER_TEMP/latest.json" ]; then exit 0; fi
          mkdir "$RUNNER_TEMP/updater" && cd "$RUNNER_TEMP/updater"
          git init -q -b updater
          cp "$RUNNER_TEMP/latest.json" latest.json
          git add latest.json
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "chore: $GITHUB_REF_NAME 在线更新文件"
          git push -f "https://bulua:${GITEE_TOKEN}@gitee.com/bulua/open-tools.git" updater

      - uses: actions/upload-artifact@v4
        with:
          name: open-tools-windows
          path: |
            src-tauri/target/release/open-tools.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
